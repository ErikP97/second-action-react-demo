# GitHub Actions workflow demonstrating multiple trigger methods
# Demonstrates: multiple triggers (push and manual), job dependencies, and deployment stages
name: Test Project
on: [push, workflow_dispatch]  # Triggers on push OR manual trigger from GitHub UI
jobs:
    # Job 1: Test - runs automated tests
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install Dependencies
              run: npm ci
            - name: Run Tests
              run: npm test
    # Job 2: Deploy - runs only after tests pass
    deploy:
        needs: test  # Waits for test job to succeed before starting
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Install Dependencies
              run: npm ci
            - name: Build project
              run: npm run build
            - name: Deploy
              run: echo "Deploying..."